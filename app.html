<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Dashboard - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img class="mark-small" src="images/logo.svg" alt="Vyro">
    <div class="tag" id="who">Loading...</div>
  </div>

  <div class="card">
    <h2>Your business</h2>
    <div class="row"><span>Name</span><b id="bizName">...</b></div>
    <div class="row"><span>Your role</span><b id="role">...</b></div>
    <div class="row"><span>Email</span><b id="mail">...</b></div>
  </div>

  <div class="card">
    <h2>Coming next</h2>
    <p>Business profile and team, customers, translator, then leads, estimates and invoices.</p>
  </div>

  <button class="btn" id="out" type="button">Sign out</button>
  <div class="note err" id="err"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  vyro.requireAuth(async function (user) {
    document.getElementById('mail').textContent = user.email;
    document.getElementById('who').textContent = 'Signed in';
    try {
      var u = await vyro.db.collection('users').doc(user.uid).get();
      var bizId = u.exists ? u.data().bizId : null;
      if (!bizId) { document.getElementById('err').textContent = 'No business found for this account.'; return; }
      var b = await vyro.db.collection('businesses').doc(bizId).get();
      var m = await vyro.db.collection('businesses').doc(bizId).collection('members').doc(user.uid).get();
      document.getElementById('bizName').textContent = b.data().name;
      document.getElementById('who').textContent = b.data().name;
      document.getElementById('role').textContent = m.exists ? m.data().role : 'unknown';
    } catch (err) {
      document.getElementById('err').textContent = vyro.friendly(err);
    }
  });
  document.getElementById('out').addEventListener('click', async function () {
    await vyro.signOut(); location.href = 'login.html';
  });
</script>
</body>
  </html>
