<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Join team - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Vyro home"></a>
    <div class="tag">Join your team</div>
  </div>

  <form class="card" id="f">
    <h2>Create your login</h2>
    <label class="field"><span>Your name</span><input id="name" type="text" autocomplete="name" required></label>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Password (8+ characters)</span><input id="pw" type="password" autocomplete="new-password" required></label>
    <label class="field"><span>Invite code</span><input id="code" type="text" autocomplete="off" required></label>
    <button class="btn" id="go" type="submit">Join team</button>
    <div class="note" id="msg"></div>
    <a class="link" href="login.html">Already have an account? Sign in</a>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  vyro.redirectIfSignedIn();
  var msg = document.getElementById('msg');
  var param = new URLSearchParams(location.search).get('code');
  if (param) { document.getElementById('code').value = param; }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = document.getElementById('pw').value;
    msg.className = 'note';
    if (pw.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; msg.className = 'note err'; return; }
    var btn = document.getElementById('go');
    btn.disabled = true; msg.textContent = 'Joining...';
    try {
      await vyro.joinTeam(
        document.getElementById('email').value.trim(), pw,
        document.getElementById('name').value.trim(), document.getElementById('code').value);
      location.href = 'app.html';
    } catch (err) {
      msg.textContent = vyro.friendly(err); msg.className = 'note err'; btn.disabled = false;
    }
  });
</script>
</body>
</html>
