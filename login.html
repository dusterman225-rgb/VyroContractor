<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05070A">
<title>Sign in - Vyro Business</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <a href="index.html"><img class="mark-small" src="images/logo.svg" alt="Vyro home"></a>
    <div class="tag">Sign in to your business</div>
  </div>

  <form class="card" id="f">
    <h2>Welcome back</h2>
    <label class="field"><span>Email</span><input id="email" type="email" placeholder="you@company.com" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required></label>
    <button class="btn" id="go" type="submit">Sign in</button>
    <div class="note" id="msg"></div>
    <button class="link" id="forgot" type="button">Forgot password?</button>
    <a class="link" href="signup.html">New here? Create an account</a>
  </form>
</div>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
  vyro.redirectIfSignedIn();
  var msg = document.getElementById('msg');
  function say(t, cls) { msg.textContent = t; msg.className = 'note ' + (cls || ''); }

  document.getElementById('f').addEventListener('submit', async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go');
    btn.disabled = true; say('Signing in...');
    try {
      await vyro.signIn(document.getElementById('email').value.trim(), document.getElementById('pw').value);
      location.href = 'app.html';
    } catch (err) {
      say(vyro.friendly(err), 'err'); btn.disabled = false;
    }
  });

  document.getElementById('forgot').addEventListener('click', async function () {
    var email = document.getElementById('email').value.trim();
    if (!email) { say('Type your email above first, then tap Forgot password.', 'err'); return; }
    try {
      await vyro.resetPassword(email);
      say('If that email has an account, a reset link is on its way. Check spam too.', 'ok');
    } catch (err) { say(vyro.friendly(err), 'err'); }
  });
</script>
</body>
  </html>
